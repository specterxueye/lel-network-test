
name: GitHub Download Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Generate random test file
        run: |
          mkdir -p output
          dd if=/dev/urandom \
            of=output/test-5mb.bin \
            bs=1M count=5 status=none

          cd output
          sha256sum test-5mb.bin > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="network-test-${GITHUB_RUN_ID}"

          gh release create "$TAG" \
            output/test-5mb.bin \
            output/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Network Test $GITHUB_RUN_ID" \
            --notes "Temporary download test." \
            --prerelease \
            --latest=false

          echo "### Download URL" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/test-5mb.bin" >> "$GITHUB_STEP_SUMMARY"
